<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Chat</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0b141a;
color:white;
display:flex;
height:100vh;
}

.sidebar{
width:280px;
background:#111b21;
border-right:1px solid #222;
display:flex;
flex-direction:column;
}

.sidebar-header{
padding:15px;
font-size:18px;
border-bottom:1px solid #222;
}

.new-chat{
margin:10px;
padding:10px;
border:none;
background:#25d366;
border-radius:6px;
cursor:pointer;
}

.chat-list{
flex:1;
overflow-y:auto;
}

.chat-user{
padding:15px;
cursor:pointer;
border-bottom:1px solid #1f2c33;
}

.chat-user:hover{
background:#1f2c33;
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

.chat-header{
padding:15px;
background:#202c33;
border-bottom:1px solid #333;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:10px;
border-radius:8px;
max-width:60%;
}

.sent{
background:#005c4b;
align-self:flex-end;
}

.received{
background:#202c33;
align-self:flex-start;
}

.input-area{
display:flex;
padding:10px;
background:#202c33;
gap:10px;
}

.input-area input{
flex:1;
padding:10px;
background:#111b21;
color:white;
border:none;
}

.input-area button{
padding:10px 20px;
background:#25d366;
border:none;
cursor:pointer;
}

img{
max-width:200px;
border-radius:6px;
cursor:pointer;

}
</style>
</head>

<body>

<div class="sidebar">
<div class="sidebar-header">Chats</div>
<button class="new-chat" onclick="startChatPrompt()">New Chat</button>
<div id="chatList" class="chat-list"></div>
</div>

<div class="chat-area">
<div id="chatHeader" class="chat-header">Select a chat</div>
<div id="messages" class="messages"></div>

<div class="input-area">
<input id="messageInput" placeholder="Type message">
<input type="file" id="imageInput">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

const socket = io();

let currentUser = sessionStorage.getItem("username");
let currentChat = null;

const chatList = document.getElementById("chatList");
const messages = document.getElementById("messages");

// ================= START CHAT =================
function startChatPrompt(){
    const username = prompt("Enter username");
    if(!username) return;

    fetch("/check-user/" + username)
    .then(res => res.json())
    .then(data => {
        if(!data.exists){
            alert("User not found");
            return;
        }

        // prevent duplicate
        if(!document.querySelector(`[data-user='${username}']`)){
            addChat(username);
        }
    });
}

// ================= ADD CHAT =================
function addChat(username){
    const chat = document.createElement("div");
    chat.className = "chat-user";
    chat.innerText = username;

    chat.onclick = function(){
        currentChat = username;
        messages.innerHTML = "";
        document.getElementById("chatHeader").innerText = username;

        socket.emit("join_room", {
            sender: currentUser,
            receiver: username
            
        });

        loadMessages(username);
        chat.setAttribute("data-user", username);
    };

    chatList.appendChild(chat);
}

// ================= LOAD MESSAGES =================
function loadMessages(username){
    fetch("/get-messages/" + currentUser + "/" + username)
    .then(res => res.json())
    .then(data => {
        data.forEach(msg => {
            displayMessage(msg.sender, msg.message, msg.type);
        });
        messages.scrollTop = messages.scrollHeight;
    });
}

// ================= DISPLAY MESSAGE =================
function displayMessage(sender, message, type){
    const box = document.createElement("div");
    box.className = "message " + (sender === currentUser ? "sent" : "received");

    if(type === "image"){
        const img = document.createElement("img");
        img.src = message;
        Origin = "anonymous";
        img.onclick = () => window.open(message, "_blank");
        box.appendChild(img);

        
        const download = document.createElement("a");
        download.href = message;
        download.download = "stego_image.png";
        download.innerText = "⬇ Download";
        download.style.display = "block";
        download.style.marginTop = "5px";
        download.style.color = "#25d366";
        download.style.textDecoration = "none";

        box.appendChild(download);

    } else {
        const text = document.createElement("span");
        text.innerText = message;
        box.appendChild(text);
    }

    messages.appendChild(box);
    messages.scrollTop = messages.scrollHeight;
}

// ================= SEND MESSAGE =================
function sendMessage(){

    if(!currentChat){
        alert("Select chat first");
        return;
    }

    const text = document.getElementById("messageInput").value;
    const file = document.getElementById("imageInput").files[0];

    // IMAGE SEND
    if(file){
        const formData = new FormData();
        formData.append("image", file);

        fetch("/upload-image", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {

            if(data.error){
                alert("Upload failed");
                return;
            }

            displayMessage(currentUser, data.url, "image");

            socket.emit("send_message", {
                sender: currentUser,
                receiver: currentChat,
                message: data.url,
                type: "image"
            });

        })
        .catch(err => {
            console.error(err);
            alert("Error uploading image");
        });

        document.getElementById("imageInput").value = "";
        return;
    }

    // TEXT SEND
    if(text.trim() === "") return;

    displayMessage(currentUser, text, "text");

    socket.emit("send_message", {
        sender: currentUser,
        receiver: currentChat,
        message: text,
        type: "text"
    });

    document.getElementById("messageInput").value = "";
}

// ================= RECEIVE MESSAGE (FIXED) =================
socket.on("receive_message", (data) => {

    console.log("Received:", data); // debug

    if(data.sender === currentUser) return;

    if(
        data.sender === currentChat &&
        data.receiver === currentUser
    ){
        displayMessage(data.sender, data.message, data.type);
    }
});

// ================= LOAD CHAT LIST =================
window.onload = function(){

    if(!currentUser){
        alert("Login first");
        return;
    }

    fetch("/get-user-chats/" + currentUser)
    .then(res => res.json())
    .then(users => {

        chatList.innerHTML = ""; // clear old

        users.forEach(user => {
            addChat(user);
        });

    })
    .catch(err => console.error(err));
};

</script>

</body>
</html>
