<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Secure Chat</title>

<link rel="preload" href="{{ url_for('static', filename='videos/17076-278405108_medium.mp4') }}" as="video" type="video/mp4">

<style>

html{
background:#000;
margin:0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", Consolas, monospace;
}

body{
min-height:100vh;
color:#f2f2f2;
}

/* VIDEO */
.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
z-index:-1;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:rgba(0,0,0,0.4);
}

.back-btn{
cursor:pointer;
font-size:22px;
}

/* PANEL */
.panel{
max-width:420px;
margin:140px auto;
padding:40px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.15);
border-radius:10px;
}

/* INPUTS */
input{
width:100%;
padding:12px;
margin-top:15px;
border-radius:6px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.08);
color:#fff;
outline:none;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:25px;
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.3);
color:#fff;
cursor:pointer;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

button:hover{
background:rgba(255,255,255,0.25);
}

.error{
margin-top:15px;
color:#ff6b6b;
font-size:14px;
}

.success{
margin-top:15px;
color:#00ff88;
font-size:14px;
}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline preload="none" class="bg-video">
<source src="{{ url_for('static', filename='videos/17076-278405108_medium.mp4') }}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- TOPBAR -->
<div class="topbar">
<h2>Login</h2>
<div class="back-btn" onclick="window.location.href='/'">←</div>
</div>

<!-- PANEL -->
<div class="panel">

<label>Username</label>
<input type="text" id="username">

<label>Password</label>
<input type="password" id="password">

<button onclick="login()">Login</button>

<div id="message"></div>

</div>

<script>

async function login(){

const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();
const messageBox = document.getElementById("message");

messageBox.className = "";
messageBox.innerText = "";

if(!username || !password){
messageBox.className = "error";
messageBox.innerText = "All fields are required.";
return;
}

try{

const res = await fetch("/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:username,
password:password
})
});

const data = await res.json();

if(res.ok){

messageBox.className = "success";
messageBox.innerText = "Login successful!";

sessionStorage.setItem("username", username);

setTimeout(()=>{
window.location.href="/chat-page";
},1000);

}else{

messageBox.className = "error";
messageBox.innerText = data.error || "Login failed.";

}

}catch(error){

messageBox.className = "error";
messageBox.innerText = "Backend not running.";

}

}

</script>

</body>
</html>
