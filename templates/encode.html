<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Encode | Secure Steganography</title>

<!-- Proper Video Preload -->
<link rel="preload" href="{{ url_for('static', filename='videos/17076-278405108_medium.mp4') }}" as="video" type="video/mp4">

<style>
html{
    background:#000;
    margin:0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Consolas, monospace;
}
body {
    opacity: 0;
    transition: opacity 0.4s ease;
}
body.loaded {
    opacity: 1;
}

body{
    min-height:100vh;
    color:#f2f2f2;
}

/* Background Video */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* Topbar */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:rgba(0,0,0,0.4);
}

.back-btn{
    font-size:22px;
    cursor:pointer;
}

/* Panel */
.panel{
    max-width:520px;
    margin:120px auto;
    padding:40px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin-top:18px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:#fff;
    outline:none;
}

input[type="file"]{
    background:transparent;
}

/* Counter */
.counter{
    font-size:12px;
    margin-top:6px;
    color:#ccc;
}

/* Button */
button{
    width:100%;
    padding:14px;
    margin-top:25px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    cursor:pointer;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    background:rgba(255,255,255,0.25);
}

/* Password rules */
.rules{
    font-size:12px;
    margin-top:8px;
    color:#ccc;
}
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline preload="none" class="bg-video">
    <source src="{{ url_for('static', filename='videos/17076-278405108_medium.mp4') }}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- Topbar -->
<div class="topbar">
    <h2>Encode Message</h2>
    <!-- FIXED BACK BUTTON -->
    <div class="back-btn" onclick="window.location.href='/'">←</div>
</div>

<!-- Panel -->
<div class="panel">

    <label>Choose Image</label>
    <input type="file" id="encodeImage" accept="image/*">

    <label>Secret Message</label>
    <input type="password" id="secretMessage" placeholder="Enter secret message">
    <div class="counter">
        Characters: <span id="charCount">0</span>
    </div>

    <label>Password</label>
    <input type="password" id="password" placeholder="Strong password (min 12 chars)">
    <div class="counter">
        Password Length: <span id="passCount">0</span>
    </div>

    <div class="rules">
        <div id="lower">✖ At least 1 lowercase letter</div>
        <div id="upper">✖ At least 1 uppercase letter</div>
        <div id="number">✖ At least 1 number</div>
        <div id="special">✖ At least 1 special character</div>
        <div id="length">✖ Minimum 12 characters</div>
    </div>

    <button id="encodeBtn">Encrypt</button>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    const secretInput = document.getElementById("secretMessage");
    const charCount = document.getElementById("charCount");
    const password = document.getElementById("password");
    const passCount = document.getElementById("passCount");

    const lower = document.getElementById("lower");
    const upper = document.getElementById("upper");
    const number = document.getElementById("number");
    const special = document.getElementById("special");
    const lengthRule = document.getElementById("length");

    /* Character counter */
    secretInput.addEventListener("input", function(){
        charCount.textContent = this.value.length;
    });

    /* Password validation */
    password.addEventListener("input", function(){
        const value = password.value;
        passCount.textContent = value.length;

        lower.innerText = /[a-z]/.test(value) ? "✔ At least 1 lowercase letter" : "✖ At least 1 lowercase letter";
        upper.innerText = /[A-Z]/.test(value) ? "✔ At least 1 uppercase letter" : "✖ At least 1 uppercase letter";
        number.innerText = /[0-9]/.test(value) ? "✔ At least 1 number" : "✖ At least 1 number";
        special.innerText = /[\W_]/.test(value) ? "✔ At least 1 special character" : "✖ At least 1 special character";
        lengthRule.innerText = value.length >= 12 ? "✔ Minimum 12 characters" : "✖ Minimum 12 characters";
    });

    /* Encrypt Button */
    document.getElementById("encodeBtn").addEventListener("click", function(){

        const imageInput = document.getElementById("encodeImage");

        if(!imageInput.files.length || !secretInput.value || !password.value){
            alert("All fields are required.");
            return;
        }

        const strongRegex =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{12,}$/;

        if(!strongRegex.test(password.value)){
            alert("Password must meet security requirements.");
            return;
        }

        const formData = new FormData();
        formData.append("image", imageInput.files[0]);
        formData.append("message", secretInput.value);
        formData.append("password", password.value);

        fetch("/encode", {
            method:"POST",
            body:formData
        })
        .then(response=>{
            if(!response.ok) throw new Error("Encryption failed");
            return response.blob();
        })
        .then(blob=>{
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "encoded_image.png";
            a.click();
            alert("✅ Encryption successful!");
        })
        .catch(()=>{
            alert("Server error.");
        });

    });

});
</script>
<script>
window.addEventListener("load", function(){
    document.body.classList.add("loaded");
});
</script>
</body>
</html>
